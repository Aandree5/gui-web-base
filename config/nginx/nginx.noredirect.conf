events {
}

http {
	# Relative to the -p prefix, so nginx never writes outside the per-UID runtime dir
	client_body_temp_path nginx/temp/client_body;
	proxy_temp_path nginx/temp/proxy;
	fastcgi_temp_path nginx/temp/fastcgi;
	uwsgi_temp_path nginx/temp/uwsgi;
	scgi_temp_path nginx/temp/scgi;

	map $http_upgrade $connection_upgrade {
		default upgrade;
		''	  close;
	}

	include /gwb/nginx/parts/nginx.http-noredirect.conf;
	include /gwb/nginx/parts/nginx.https.conf;
}
